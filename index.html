<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutant Fridge Mayhem - Leaderboards</title>
    <link rel="icon" type="image/png" href="gui_achievementicon_sharkbearagator.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-anim {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 25%, #0a1a2e 50%, #1a0a1a 75%, #0a0a1a 100%);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
        }
        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 { width: 500px; height: 500px; top: -150px; left: -100px; background: rgba(255, 107, 107, 0.12); animation: orbFloat1 12s ease-in-out infinite; }
        .bg-orb-2 { width: 400px; height: 400px; bottom: -100px; right: -100px; background: rgba(78, 205, 196, 0.1); animation: orbFloat2 15s ease-in-out infinite; }
        .bg-orb-3 { width: 350px; height: 350px; top: 40%; left: 60%; background: rgba(168, 130, 255, 0.08); animation: orbFloat3 18s ease-in-out infinite; }
        @keyframes orbFloat1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 40px); } }
        @keyframes orbFloat2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -30px); } }
        @keyframes orbFloat3 { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(-40px, 30px); } 66% { transform: translate(30px, -20px); } }

        #particleCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            position: relative;
            z-index: 1;
        }

        /* Logo area */
        .logo-area { text-align: center; margin-bottom: 12px; }

        .logo-icon {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: iconPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, iconFloat 3.5s ease-in-out infinite 0.7s;
            opacity: 0;
            transform: scale(0.2) rotate(-15deg);
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.3));
        }
        .logo-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 26px; }
        @keyframes iconPop {
            0% { opacity: 0; transform: scale(0.2) rotate(-15deg) translateY(40px); }
            60% { transform: scale(1.1) rotate(3deg) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) rotate(0deg) translateY(0); }
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(1deg); }
            75% { transform: translateY(4px) rotate(-1deg); }
        }

        .logo-banner {
            width: 100%;
            max-width: 580px;
            height: 140px;
            margin: 0 auto 10px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bannerDrop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards, bannerFloat 5s ease-in-out infinite 0.95s;
            opacity: 0;
            transform: scale(0.4) translateY(-40px);
            filter: drop-shadow(0 4px 30px rgba(78, 205, 196, 0.2));
        }
        .logo-banner img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
        @keyframes bannerDrop {
            0% { opacity: 0; transform: scale(0.4) translateY(-40px); }
            60% { transform: scale(1.05) translateY(5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes bannerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Title */
        .title {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeUp 0.6s ease 0.35s forwards;
            opacity: 0;
            transform: translateY(25px);
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .title h1 {
            font-family: 'Bangers', cursive;
            font-size: 52px;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ffa502, #4ecdc4, #a882ff, #ff6b6b);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
            filter: drop-shadow(0 2px 12px rgba(255, 107, 107, 0.25));
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .title p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 28px;
            animation: fadeUp 0.6s ease 0.5s forwards;
            opacity: 0;
            transform: translateY(25px);
        }
        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 28px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
        }
        .stat-item:hover {
            transform: translateY(-3px);
            border-color: rgba(78, 205, 196, 0.3);
        }
        .stat-value {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            color: #4ecdc4;
            text-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 800;
            margin-top: 2px;
        }

        /* Leaderboard */
        .leaderboard {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            backdrop-filter: blur(16px);
            animation: fadeUp 0.6s ease 0.65s forwards;
            opacity: 0;
            transform: translateY(25px);
            position: relative;
        }
        .leaderboard::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.3), rgba(78, 205, 196, 0.3), rgba(168, 130, 255, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderGlow 4s ease infinite;
            pointer-events: none;
        }
        @keyframes borderGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 50px 1.2fr 130px 90px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 800;
        }

        .leaderboard-row {
            display: grid;
            grid-template-columns: 50px 1.2fr 130px 90px;
            padding: 15px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: rowSlide 0.5s ease forwards;
            opacity: 0;
            transform: translateX(-20px);
            position: relative;
            cursor: default;
        }
        .leaderboard-row:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(4px) scale(1.01);
        }
        .leaderboard-row:last-child { border-bottom: none; }
        @keyframes rowSlide {
            to { opacity: 1; transform: translateX(0); }
        }

        .leaderboard-row.top-1 {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.02) 60%, transparent 100%);
            border-left: 3px solid #ffd700;
        }
        .leaderboard-row.top-1::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.06), transparent 60%);
            animation: crownPulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes crownPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .leaderboard-row.top-2 {
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.07) 0%, transparent 60%);
            border-left: 3px solid #c0c0c0;
        }
        .leaderboard-row.top-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.07) 0%, transparent 60%);
            border-left: 3px solid #cd7f32;
        }

        .rank {
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-1 .rank { color: #ffd700; font-size: 20px; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); }
        .top-2 .rank { color: #c0c0c0; font-size: 19px; }
        .top-3 .rank { color: #cd7f32; font-size: 19px; }

        .medal { font-size: 20px; }

        .player-name {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-name .crown { font-size: 18px; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5)); }

        .player-score {
            text-align: right;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.2);
        }

        .player-stage {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-1 .player-stage { color: rgba(255, 215, 0, 0.6); }
        .top-2 .player-stage { color: rgba(192, 192, 192, 0.5); }
        .top-3 .player-stage { color: rgba(205, 127, 50, 0.5); }
        .top-1 .player-score { color: #ffd700; font-size: 20px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .top-2 .player-score { color: #c0c0c0; }
        .top-3 .player-score { color: #cd7f32; }

        /* Empty state */
        .empty-state { text-align: center; padding: 70px 20px; color: rgba(255, 255, 255, 0.3); }
        .empty-state .icon { font-size: 52px; margin-bottom: 14px; animation: emptyBounce 2s ease-in-out infinite; }
        @keyframes emptyBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .empty-state p { font-size: 15px; font-weight: 700; }

        /* Loading */
        .loading { text-align: center; padding: 70px 20px; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #4ecdc4;
            border-right-color: #ff6b6b;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 13px; color: rgba(255, 255, 255, 0.3); font-weight: 600; }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            animation: fadeUp 0.6s ease 0.8s forwards;
            opacity: 0;
            transform: translateY(25px);
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .title h1 { font-size: 38px; }
            .stats-bar { gap: 12px; }
            .stat-item { padding: 12px 18px; }
            .stat-value { font-size: 22px; }
            .leaderboard-header,
            .leaderboard-row { grid-template-columns: 42px 1fr 70px 65px; padding: 12px 14px; gap: 2px; }
            .rank { font-size: 14px; }
            .player-name { font-size: 12px; }
            .player-score { font-size: 14px; }
            .player-stage { font-size: 10px; }
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: linear-gradient(135deg, #1e1e3a, #16213e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(78, 205, 196, 0.1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h2 {
            font-family: 'Bangers', cursive;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        .modal-input:focus {
            border-color: #4ecdc4;
        }
        .modal-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .modal-btn {
            display: inline-block;
            padding: 12px 36px;
            border-radius: 14px;
            border: none;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-btn-primary {
            background: linear-gradient(135deg, #4ecdc4, #44a8a0);
            color: #fff;
            box-shadow: 0 4px 20px rgba(78, 205, 196, 0.3);
        }
        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(78, 205, 196, 0.4);
        }
        .modal-btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }
        .modal-btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.4);
        }
        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            margin-left: 10px;
        }
        .modal-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .modal-score {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: #4ecdc4;
            margin: 12px 0 20px;
            text-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .modal-error {
            font-size: 13px;
            color: #ff6b6b;
            margin-top: 12px;
            font-weight: 700;
        }

        .modal-success {
            font-size: 14px;
            color: #4ecdc4;
            margin-top: 16px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="bg-anim"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon"><img src="menu_main_logo2.png" alt="MFM"></div>
            <div class="logo-banner"><img src="menu_main_logo.png" alt="Mutant Fridge Mayhem"></div>
        </div>

        <div class="title">
            <h1>Leaderboards</h1>
            <p>Mutant Fridge Mayhem &mdash; PC Port</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalPlayers">-</div>
                <div class="stat-label">Players</div>
            </div>
        </div>

        <div class="leaderboard">
            <div class="leaderboard-header">
                <div>#</div>
                <div>Player</div>
                <div style="text-align:right">Score</div>
                <div style="text-align:center">Stage</div>
            </div>
            <div id="leaderboardBody">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading scores...</p>
                </div>
            </div>
        </div>

        <div class="footer">Built with love for the Watterson family</div>
    </div>

    <div id="modalContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function fetchLeaderboard() {
            const body = document.getElementById('leaderboardBody');
            try {
                const snap = await db.collection('scores').orderBy('score', 'desc').limit(100).get();
                const players = [];
                snap.forEach(doc => players.push(doc.data()));

                if (players.length === 0) {
                    body.innerHTML = '<div class="empty-state"><div class="icon">&#127942;</div><p>No scores yet. Be the first!</p></div>';
                    return;
                }

                document.getElementById('totalPlayers').textContent = players.length;

                const medals = ['&#129351;', '&#129352;', '&#129353;'];
                let html = '';
                players.forEach((player, i) => {
                    const rank = i + 1;
                    let cls = 'leaderboard-row';
                    let prefix = '';
                    if (rank === 1) { cls += ' top-1'; prefix = '<span class="crown">&#128081;</span>'; }
                    else if (rank === 2) { cls += ' top-2'; }
                    else if (rank === 3) { cls += ' top-3'; }

                    const medal = rank <= 3 ? `<span class="medal">${medals[rank - 1]}</span>` : '';
                    const delay = (0.7 + Math.min(i * 0.06, 1.2)).toFixed(2);
                    const stage = player.stage ? `Ch${player.chapter || '?'}-${player.stage}` : '-';
                    html += `<div class="${cls}" style="animation-delay:${delay}s">
                        <div class="rank">${medal}${rank}</div>
                        <div class="player-name">${prefix}${esc(player.name)}</div>
                        <div class="player-score">${player.score.toLocaleString()}</div>
                        <div class="player-stage">${stage}</div>
                    </div>`;
                });
                body.innerHTML = html;
            } catch (e) {
                console.error(e);
                body.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div><p>Could not load scores. Try again later.</p></div>';
            }
        }

        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        fetchLeaderboard();

        // ============================================
        // Handle game score submission via URL params
        // ============================================
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            const gameScore = parseInt(params.get('score') || '0');
            const gameCh = parseInt(params.get('ch') || '1');
            const gameSt = parseInt(params.get('st') || '1');
            if (!uid || !gameScore) return;

            const container = document.getElementById('modalContainer');
            const doc = await db.collection('scores').doc(uid).get();
            const existing = doc.exists ? doc.data() : null;

            // New user — ask for name
            if (!existing) {
                container.innerHTML = `
                    <div class="modal-overlay">
                        <div class="modal">
                            <h2>Welcome!</h2>
                            <p>Enter your name to join the leaderboard</p>
                            <input class="modal-input" id="nameInput" maxlength="20" placeholder="Your name..." autofocus>
                            <div>
                                <button class="modal-btn modal-btn-primary" id="nameSubmit">Submit</button>
                            </div>
                            <div class="modal-error" id="nameError" style="display:none"></div>
                        </div>
                    </div>`;
                document.getElementById('nameSubmit').onclick = async () => {
                    const name = document.getElementById('nameInput').value.trim();
                    if (!name) {
                        document.getElementById('nameError').textContent = 'Please enter a name';
                        document.getElementById('nameError').style.display = 'block';
                        return;
                    }
                    await db.collection('scores').doc(uid).set({
                        name: name, score: gameScore, chapter: gameCh, stage: gameSt
                    });
                    container.innerHTML = `
                        <div class="modal-overlay">
                            <div class="modal">
                                <h2>Score Submitted!</h2>
                                <div class="modal-score">${gameScore.toLocaleString()}</div>
                                <p>Welcome to the leaderboard, ${esc(name)}!</p>
                                <div class="modal-success">Rank #${(await getRank(gameScore)) + 1}</div>
                            </div>
                        </div>`;
                    setTimeout(() => { container.innerHTML = ''; fetchLeaderboard(); }, 3000);
                };
                document.getElementById('nameInput').onkeydown = (e) => {
                    if (e.key === 'Enter') document.getElementById('nameSubmit').click();
                };
                return;
            }

            // Existing user — score not higher
            if (gameScore <= existing.score) {
                container.innerHTML = `
                    <div class="modal-overlay">
                        <div class="modal">
                            <h2>Score Not Higher</h2>
                            <p>Your current best: <strong>${existing.score.toLocaleString()}</strong></p>
                            <p>New score: <strong>${gameScore.toLocaleString()}</strong></p>
                            <div class="modal-error">Play harder and beat your record!</div>
                            <div style="margin-top:20px">
                                <button class="modal-btn modal-btn-secondary" onclick="document.getElementById('modalContainer').innerHTML=''">Close</button>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            // Existing user — score is higher — confirm
            container.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal">
                        <h2>New High Score!</h2>
                        <p>Previous best: <strong>${existing.score.toLocaleString()}</strong></p>
                        <div class="modal-score">${gameScore.toLocaleString()}</div>
                        <p>Submit your new record to the leaderboard?</p>
                        <div>
                            <button class="modal-btn modal-btn-primary" id="confirmSubmit">Submit</button>
                            <button class="modal-btn modal-btn-secondary" id="cancelSubmit">Cancel</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('confirmSubmit').onclick = async () => {
                await db.collection('scores').doc(uid).set({
                    name: existing.name, score: gameScore, chapter: gameCh, stage: gameSt
                });
                container.innerHTML = `
                    <div class="modal-overlay">
                        <div class="modal">
                            <h2>Score Updated!</h2>
                            <div class="modal-score">${gameScore.toLocaleString()}</div>
                            <div class="modal-success">Rank #${(await getRank(gameScore)) + 1}</div>
                        </div>
                    </div>`;
                setTimeout(() => { container.innerHTML = ''; fetchLeaderboard(); }, 3000);
            };
            document.getElementById('cancelSubmit').onclick = () => { container.innerHTML = ''; };
        })();

        async function getRank(score) {
            const snap = await db.collection('scores').where('score', '>', score).get();
            return snap.size;
        }
    </script>

    <script>
    (function() {
        const C = document.getElementById('particleCanvas');
        const ctx = C.getContext('2d');
        let W, H, mx = -999, my = -999;
        const particles = [];
        const COUNT = 65;
        const RADIUS = 140;

        const palette = [
            [255, 107, 107],
            [78, 205, 196],
            [255, 165, 2],
            [168, 130, 255],
            [255, 255, 255],
            [255, 107, 180],
        ];

        function resize() { W = C.width = window.innerWidth; H = C.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
        document.addEventListener('mouseleave', () => { mx = -999; my = -999; });

        function P(init) {
            this.x = Math.random() * W;
            this.y = init ? Math.random() * H : H + 20;
            this.r = Math.random() * 5 + 1.5;
            this.vx = (Math.random() - 0.5) * 0.35;
            this.vy = -(Math.random() * 0.5 + 0.12);
            this.o = Math.random() * 0.35 + 0.08;
            this.c = palette[Math.floor(Math.random() * palette.length)];
            this.rot = Math.random() * Math.PI * 2;
            this.rv = (Math.random() - 0.5) * 0.015;
            this.phase = Math.random() * Math.PI * 2;
            this.pspeed = Math.random() * 0.025 + 0.008;
            this.shape = Math.floor(Math.random() * 4);
        }

        P.prototype.update = function() {
            this.x += this.vx;
            this.y += this.vy;
            this.rot += this.rv;
            this.phase += this.pspeed;

            const dx = this.x - mx, dy = this.y - my;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < RADIUS && d > 0) {
                const f = (RADIUS - d) / RADIUS;
                const a = Math.atan2(dy, dx);
                this.x += Math.cos(a) * f * 4;
                this.y += Math.sin(a) * f * 4;
                this.o = Math.min(this.o + 0.03, 0.85);
            }

            if (this.y < -30 || this.x < -30 || this.x > W + 30) {
                this.x = Math.random() * W;
                this.y = H + 20;
                this.o = Math.random() * 0.35 + 0.08;
            }
        };

        P.prototype.draw = function() {
            const op = this.o * (0.6 + Math.sin(this.phase) * 0.4);
            const [r, g, b] = this.c;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rot);
            ctx.fillStyle = `rgba(${r},${g},${b},${op})`;
            ctx.shadowColor = `rgba(${r},${g},${b},${op * 0.6})`;
            ctx.shadowBlur = 12;

            const s = this.r;
            if (this.shape === 0) {
                ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
            } else if (this.shape === 1) {
                star(ctx, 0, 0, 5, s, s * 0.4); ctx.fill();
            } else if (this.shape === 2) {
                ctx.beginPath();
                ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.6, 0);
                ctx.closePath(); ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(-s, -s * 0.3); ctx.lineTo(-s * 0.3, -s);
                ctx.lineTo(s, -s * 0.3); ctx.lineTo(s * 0.3, s);
                ctx.lineTo(-s, s * 0.3);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        };

        function star(ctx, cx, cy, n, or, ir) {
            let r = -Math.PI / 2; const step = Math.PI / n;
            ctx.beginPath(); ctx.moveTo(cx, cy - or);
            for (let i = 0; i < n; i++) {
                ctx.lineTo(cx + Math.cos(r) * or, cy + Math.sin(r) * or); r += step;
                ctx.lineTo(cx + Math.cos(r) * ir, cy + Math.sin(r) * ir); r += step;
            }
            ctx.closePath();
        }

        for (let i = 0; i < COUNT; i++) particles.push(new P(true));

        function animate() {
            ctx.clearRect(0, 0, W, H);

            // Draw connections
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 120) {
                        const op = (1 - d / 120) * 0.12;
                        ctx.strokeStyle = `rgba(78, 205, 196, ${op})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Cursor glow
            if (mx > 0) {
                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, RADIUS);
                grad.addColorStop(0, 'rgba(78, 205, 196, 0.06)');
                grad.addColorStop(1, 'rgba(78, 205, 196, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(mx, my, RADIUS, 0, Math.PI * 2); ctx.fill();
            }

            for (const p of particles) { p.update(); p.draw(); }
            requestAnimationFrame(animate);
        }
        animate();
    })();
    </script>
</body>
